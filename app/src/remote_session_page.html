<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Warp 会话</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --surface: rgba(29, 32, 39, .82);
      --surface-strong: #20242c;
      --line: rgba(255, 255, 255, .09);
      --text: #f5f3ed;
      --muted: #9299a8;
      --subtle: #626a79;
      --accent: #dfff4f;
      --accent-soft: rgba(223, 255, 79, .12);
      --shadow: 0 18px 50px rgba(0, 0, 0, .22);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 34% at 100% 0%, rgba(111, 133, 53, .16), transparent 72%),
        radial-gradient(ellipse 65% 30% at 0% 42%, rgba(63, 76, 113, .12), transparent 75%),
        var(--bg);
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .app { width: min(100%, 760px); margin: 0 auto; padding: 24px 20px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px;
      color: #171b0b; background: var(--accent); font-size: 20px; font-weight: 800;
      box-shadow: 0 5px 22px rgba(223, 255, 79, .16);
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .icon-button {
      display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--line);
      border-radius: 13px; color: var(--muted); background: rgba(255, 255, 255, .035);
      transition: color .18s, background .18s, border-color .18s, transform .18s;
    }
    .icon-button:hover { color: var(--text); background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .18); }
    .icon-button:active { transform: scale(.95); }
    .icon-button:disabled { cursor: wait; opacity: .6; }
    .icon-button svg { width: 18px; height: 18px; }
    .icon-button.loading svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hero { margin: 40px 0 25px; }
    .eyebrow { display: flex; align-items: center; gap: 7px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    h1 { margin: 12px 0 8px; font-size: clamp(29px, 7vw, 38px); line-height: 1.12; letter-spacing: -.055em; }
    .hero-copy { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }

    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { color: #d8dce4; font-size: 13px; font-weight: 650; }
    .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    .sessions { display: grid; gap: 10px; }
    .session {
      position: relative; display: flex; align-items: center; gap: 13px; width: 100%; min-height: 78px;
      padding: 15px; text-align: left; color: var(--text); background: var(--surface);
      border: 1px solid var(--line); border-radius: 17px; box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
      transition: border-color .18s, background .18s, transform .18s, box-shadow .18s;
    }
    .session:hover { background: var(--surface-strong); border-color: rgba(255, 255, 255, .17); transform: translateY(-1px); }
    .session.active { background: linear-gradient(115deg, rgba(223, 255, 79, .13), rgba(29, 32, 39, .9) 65%); border-color: rgba(223, 255, 79, .65); box-shadow: 0 8px 30px rgba(0, 0, 0, .16), 0 0 0 1px rgba(223, 255, 79, .06); }
    .session-icon { display: grid; place-items: center; flex: 0 0 39px; width: 39px; height: 39px; border-radius: 12px; color: #c5cbd6; background: rgba(255, 255, 255, .065); }
    .session.active .session-icon { color: var(--accent); background: var(--accent-soft); }
    .session-icon svg { width: 19px; height: 19px; }
    .session-info { min-width: 0; flex: 1; }
    .session-title { overflow: hidden; color: #e9ebef; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .session-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #86d99b; }
    .session-chevron { flex: 0 0 auto; color: var(--subtle); }
    .session.active .session-chevron { color: var(--accent); }
    .session-chevron svg { width: 16px; height: 16px; }

    .empty { padding: 42px 24px; text-align: center; background: rgba(255, 255, 255, .025); border: 1px dashed rgba(255, 255, 255, .13); border-radius: 20px; }
    .empty-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 17px; color: var(--muted); background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 16px; }
    .empty-icon svg { width: 24px; height: 24px; }
    .empty-title { margin: 0; font-size: 15px; font-weight: 600; }
    .empty-copy { max-width: 280px; margin: 9px auto 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .secondary-button { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; color: #dce1e9; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
    .secondary-button:hover { background: rgba(255, 255, 255, .12); }
    .secondary-button svg { width: 14px; height: 14px; }

    .viewer { margin-top: 22px; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: rgba(17, 19, 24, .88); box-shadow: var(--shadow); }
    .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .025); }
    .viewer-name { display: flex; align-items: center; gap: 8px; min-width: 0; color: #e9ebef; font-size: 13px; font-weight: 600; }
    .viewer-name > span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .live-dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .readonly-badge { flex: 0 0 auto; padding: 3px 7px; color: var(--muted); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 6px; font-size: 10px; font-weight: 650; letter-spacing: .04em; }
    .viewer-actions { display: flex; align-items: center; gap: 8px; }
    .viewer-refresh { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: transparent; }
    .viewer-refresh:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
    .viewer-refresh svg { width: 15px; height: 15px; }
    .viewer-refresh.loading svg { animation: spin .8s linear infinite; }
    .content {
      margin: 0; padding: 16px; min-height: 220px; max-height: 52vh; overflow: auto;
      color: #c7ceda; background: #0d0f13; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
      tab-size: 4; overscroll-behavior: contain;
    }
    .content.placeholder { color: var(--subtle); }
    .viewer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; color: var(--subtle); font-size: 11px; border-top: 1px solid var(--line); }
    .viewer-foot .live { color: #8a9bb0; }

    .hint { display: flex; align-items: flex-start; gap: 8px; margin: 18px 2px 0; color: var(--subtle); font-size: 11px; line-height: 1.6; }
    .hint svg { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 2px; }
    .log { min-height: 17px; margin: 10px 2px 0; color: var(--muted); font-size: 11px; }
    .log.error { color: #f29b9b; }

    @media (min-width: 600px) {
      .app { padding-top: 34px; }
      .hero { margin-top: 54px; }
      .session { min-height: 86px; padding: 18px; }
      .content { max-height: 58vh; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌁</div>
        <div>
          <div class="brand-name">Warp</div>
          <div class="brand-caption">Remote workspace</div>
        </div>
      </div>
      <button id="refresh" class="icon-button" type="button" aria-label="刷新会话" title="刷新会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.7-3L3 11"/><path d="M3 4v7h7"/><path d="M4 13a8.1 8.1 0 0 0 14.7 3L21 13"/><path d="M21 20v-7h-7"/></svg>
      </button>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">Your workspace</div>
      <h1 id="page-title">你的会话</h1>
      <p class="hero-copy">只读查看终端输出。<br>不会向 Warp 会话发送任何内容。</p>
    </section>

    <main>
      <div class="section-heading">
        <span class="section-title">已打开的会话</span>
        <span id="count" class="count">加载中…</span>
      </div>
      <div id="sessions" class="sessions" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
        </div>
        <h2 class="empty-title">还没有打开的会话</h2>
        <p class="empty-copy">在 Warp 中打开一个终端会话后，<br>点击刷新就能在这里看到内容。</p>
        <button id="empty-refresh" class="secondary-button" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.7-3L3 11"/><path d="M3 4v7h7"/><path d="M4 13a8.1 8.1 0 0 0 14.7 3L21 13"/><path d="M21 20v-7h-7"/></svg>
          刷新会话
        </button>
      </div>

      <section id="viewer" class="viewer" hidden aria-label="会话内容">
        <div class="viewer-head">
          <div class="viewer-name">
            <span class="live-dot"></span>
            <span id="viewer-title">会话内容</span>
            <span class="readonly-badge">只读</span>
          </div>
          <div class="viewer-actions">
            <button id="content-refresh" class="viewer-refresh" type="button" aria-label="刷新内容" title="刷新内容">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.7-3L3 11"/><path d="M3 4v7h7"/><path d="M4 13a8.1 8.1 0 0 0 14.7 3L21 13"/><path d="M21 20v-7h-7"/></svg>
            </button>
          </div>
        </div>
        <pre id="content" class="content placeholder">选择会话后显示内容</pre>
        <div class="viewer-foot">
          <span id="content-status">等待选择会话</span>
          <span class="live">自动刷新</span>
        </div>
      </section>

      <p class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        页面只读取最近的终端输出，不会发送键盘输入或命令。
      </p>
      <p id="log" class="log" role="status" aria-live="polite"></p>
    </main>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get("token") || "warp-dev";
    const sessionsEl = document.querySelector("#sessions");
    const emptyEl = document.querySelector("#empty");
    const countEl = document.querySelector("#count");
    const refreshButton = document.querySelector("#refresh");
    const contentRefreshButton = document.querySelector("#content-refresh");
    const viewerEl = document.querySelector("#viewer");
    const viewerTitle = document.querySelector("#viewer-title");
    const contentEl = document.querySelector("#content");
    const contentStatus = document.querySelector("#content-status");
    const logEl = document.querySelector("#log");
    let selected = null;
    let sessions = [];
    let contentLoading = false;

    const terminalIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>';
    const chevronIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';

    function log(message, kind = "") {
      logEl.textContent = message;
      logEl.className = `log ${kind}`;
    }

    function selectedSession() {
      return sessions.find((item) => item.id === selected) || null;
    }

    function renderSessions() {
      sessionsEl.replaceChildren();
      countEl.textContent = `${sessions.length} 个会话`;
      emptyEl.hidden = sessions.length !== 0;
      if (selected && !sessions.some((item) => item.id === selected)) selected = null;
      for (const session of sessions) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `session${session.id === selected ? " active" : ""}`;
        button.dataset.id = session.id;
        button.setAttribute("aria-pressed", String(session.id === selected));
        button.innerHTML = `<span class="session-icon">${terminalIcon}</span><span class="session-info"><span class="session-title"></span><span class="session-meta"><span class="status-dot"></span><span>终端会话 · 标签 ${session.tab}</span></span></span><span class="session-chevron">${chevronIcon}</span>`;
        button.querySelector(".session-title").textContent = session.title || `标签 ${session.tab}`;
        button.addEventListener("click", () => selectSession(session.id));
        sessionsEl.appendChild(button);
      }
      if (!selected && sessions.length) selectSession(sessions[0].id, false);
      updateViewer();
    }

    function updateViewer() {
      const session = selectedSession();
      if (!session) {
        viewerEl.hidden = true;
        contentStatus.textContent = "等待选择会话";
        return;
      }
      viewerEl.hidden = false;
      viewerTitle.textContent = session.title || `标签 ${session.tab}`;
    }

    function selectSession(id, load = true) {
      selected = id;
      for (const card of sessionsEl.querySelectorAll(".session")) {
        const active = card.dataset.id === id;
        card.classList.toggle("active", active);
        card.setAttribute("aria-pressed", String(active));
      }
      updateViewer();
      log("");
      if (load) loadContent();
    }

    async function loadContent() {
      const session = selectedSession();
      if (!session || contentLoading) return;
      contentLoading = true;
      contentRefreshButton.classList.add("loading");
      contentRefreshButton.disabled = true;
      const nearBottom = contentEl.scrollHeight - contentEl.scrollTop - contentEl.clientHeight < 48;
      try {
        const response = await fetch(`/api/content?id=${encodeURIComponent(session.id)}`, {
          headers: { "x-warp-token": token },
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "读取会话内容失败");
        const text = (body.content && body.content.text) || "";
        contentEl.classList.toggle("placeholder", !text);
        contentEl.textContent = text || "暂无可见输出";
        if (nearBottom) contentEl.scrollTop = contentEl.scrollHeight;
        contentStatus.textContent = `更新于 ${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
        log("");
      } catch (error) {
        contentStatus.textContent = "更新失败";
        log(error.message || "读取会话内容失败", "error");
      } finally {
        contentLoading = false;
        contentRefreshButton.classList.remove("loading");
        contentRefreshButton.disabled = false;
      }
    }

    async function loadSessions() {
      refreshButton.classList.add("loading");
      refreshButton.disabled = true;
      countEl.textContent = "加载中…";
      try {
        const response = await fetch("/api/sessions", { headers: { "x-warp-token": token } });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "无法读取会话");
        sessions = Array.isArray(body.sessions) ? body.sessions : [];
        renderSessions();
        if (selected) loadContent();
      } catch (error) {
        sessions = [];
        selected = null;
        renderSessions();
        log(error.message || "连接 Warp 失败", "error");
      } finally {
        refreshButton.classList.remove("loading");
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadSessions);
    document.querySelector("#empty-refresh").addEventListener("click", loadSessions);
    contentRefreshButton.addEventListener("click", loadContent);
    setInterval(() => {
      if (selected && !document.hidden) loadContent();
    }, 2500);
    loadSessions();
  </script>
</body>
</html>
